            async function build() {
                let protoReq = await fetch("./protocol.json");
                let { enums, requests, events } = await protoReq.json();

                console.log("build", requests.length);
                let sel = document.querySelector('select[name="request"]');
                for (var x = 0; x < requests.length; x++) {
                    let { category, requestType } = requests[x];
                    let optGroup = sel.querySelector(
                        `optgroup[label="${category}"]`,
                    );
                    if (!optGroup) {
                        optGroup = document.createElement("optgroup");
                        optGroup.setAttribute("label", category);
                        sel.append(optGroup);
                    }

                    let opt = document.createElement("option");
                    optGroup.append(opt);
                    opt.textContent = requestType;

                    //obsCommands.append(opt.cloneNode(true));
                    let dataopt = document.createElement("option");
                    dataopt.textContent = `${category} - ${requestType}`;
                    dataopt.value = requestType;
                    obsCommands.append(dataopt);
                }
                sel.addEventListener("change", (e) => {
                    let task = e.target.value;
                    document.querySelector(
                        'div[name="requestFields"]',
                    ).textContent = "";

                    for (var x = 0; x < requests.length; x++) {
                        let { requestType, requestFields, responseFields } =
                            requests[x];

                        // is this a Set? Does it have a GET
                        // lets invoke the GET and populate the field

                        if (requestType != task) {
                            continue;
                        }

                        for (var y = 0; y < requestFields.length; y++) {
                            let { valueName, valueDescription, valueType } =
                                requestFields[y];
                            let {
                                valueRestrictions,
                                valueOptional,
                                valueOptionalBehavior,
                            } = requestFields[y];

                            let d = document.createElement("div");
                            d.classList.add("input-group");
                            document
                                .querySelector('div[name="requestFields"]')
                                .append(d);

                            let lbl = document.createElement("label");
                            lbl.textContent = valueName;
                            lbl.setAttribute("for", valueName);
                            lbl.classList.add("input-group-text");
                            d.append(lbl);

                            let inp = document.createElement("input");
                            inp.setAttribute("name", valueName);
                            inp.setAttribute("id", valueName);
                            inp.classList.add("form-control");
                            d.append(inp);

                            let hlp = document.createElement("div");
                            hlp.textContent = valueDescription;
                            hlp.classList.add("input-group-text");
                            d.append(hlp);
                        }
                    }
                });

                tester.addEventListener("submit", async (e) => {
                    e.preventDefault();

                    let callFunc = document.querySelector(
                        'select[name="request"]',
                    ).value;
                    // collect fields

                    let resp = await obs.call(callFunc);
                    console.log(resp);
                });
            }
            build();
